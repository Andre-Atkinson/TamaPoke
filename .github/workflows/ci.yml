name: CI

# Once per change: on pull requests, and on pushes to main (the merge itself).
# A push to a PR branch used to run the same checks twice (push + pull_request).
# Branches without a PR don't run CI; use workflow_dispatch (Actions tab) for those.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads the repo: keep the job token read-only.
permissions:
  contents: read

# A newer push to a pull request cancels that PR's older run. Pushes to main
# and manual runs each get a group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The ESP32 core and the libraries the firmware builds against, pinned. Bump
# them by hand and on purpose: a new core version has broken third-party
# libraries before. They are also the key of the cache below.
env:
  ESP32_CORE: esp32:esp32@3.3.10
  ARDUINO_LIBRARIES: |
    GFX Library for Arduino@1.6.9
    SensorLib@0.5.2
    XPowersLib@0.3.3
    U8g2@2.36.19

jobs:
  # The two boards compile in parallel, each from scratch: CI keeps no build
  # output between runs, only the installed core and libraries. Each also fails
  # on sketch warnings over WARN_BASELINE, counted as tools/gate.sh counts them.
  firmware-build:
    name: Compile firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ["1.75", "1.75C"]
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Cache key
        id: key
        run: |
          libs="$(printf '%s\n' "$ESP32_CORE" "$ARDUINO_LIBRARIES" | sha256sum | cut -c1-16)"
          echo "key=arduino-${{ runner.os }}-${ESP32_CORE//:/-}-$libs" >> "$GITHUB_OUTPUT"

      # The installed core, toolchains and libraries (not the downloaded
      # archives in staging/). Saved from runs on main and manual runs only;
      # pull requests read main's cache, so they don't fill the repo's quota.
      - name: Restore the ESP32 core and libraries
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.arduino15
            !~/.arduino15/staging
            ~/Arduino/libraries
          key: ${{ steps.key.outputs.key }}

      - name: Install the ESP32 core and libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          mapfile -t libs < <(printf '%s\n' "$ARDUINO_LIBRARIES" | sed '/^$/d')
          arduino-cli lib install "${libs[@]}"

      - name: Save the ESP32 core and libraries
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && matrix.board == '1.75C'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.arduino15
            !~/.arduino15/staging
            ~/Arduino/libraries
          key: ${{ steps.key.outputs.key }}

      # Fails if the cache (or the install) holds anything but the pinned versions.
      - name: Check the installed versions
        run: |
          arduino-cli core list
          arduino-cli lib list
          arduino-cli core list --json | python3 -c '
          import json, os, sys
          name, version = os.environ["ESP32_CORE"].split("@")
          platforms = json.load(sys.stdin).get("platforms", [])
          got = [p.get("installed_version") for p in platforms if p.get("id") == name]
          sys.exit(0 if got == [version] else f"{name}: want {version}, got {got}")'
          arduino-cli lib list --json | python3 -c '
          import json, os, sys
          want = dict(l.rsplit("@", 1) for l in os.environ["ARDUINO_LIBRARIES"].splitlines() if l)
          got = {l["library"]["name"]: l["library"]["version"]
                 for l in json.load(sys.stdin).get("installed_libraries", [])}
          sys.exit(0 if all(got.get(n) == v for n, v in want.items()) else f"want {want}, got {got}")'

      # Each compile keeps its output in build.log for the warning count below.
      # "shell: bash" runs with pipefail, so a failed compile still fails the step.
      - name: Compile (original 1.75)
        if: matrix.board == '1.75'
        shell: bash
        run: >
          arduino-cli compile --warnings=all --clean
          --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB"
          . 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Waveshare AMOLED 1.75C (experimental): mismo codigo con
      # -DBOARD_AMOLED_175C=1 y su tabla de particiones (boards/175c/). Se
      # compila con el mismo script que se usa en casa para que no se oxide.
      # From scratch (--clean) and on every core, like the 1.75 build.
      - name: Compile (Waveshare AMOLED 1.75C)
        if: matrix.board == '1.75C'
        shell: bash
        env:
          TAMAPOKE_JOBS: "0"
        run: tools/build_175c.sh --clean --out "$RUNNER_TEMP/out-175c" 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The same count and WARN_BASELINE as tools/gate.sh (both use this script).
      # CI builds from scratch, so every sketch warning is in the log.
      - name: Sketch warnings within the baseline
        run: tools/sketch_warnings.sh "$RUNNER_TEMP/build.log"

  # The "Protect main" ruleset requires a check named exactly "Compile
  # firmware": this job, which passes only if both boards compiled within the
  # warning baseline. It runs even when a build failed or the run was
  # cancelled (always()), because a skipped required check would count as
  # passing.
  firmware:
    name: Compile firmware
    needs: firmware-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Both boards compiled
        run: |
          echo "board builds: ${{ needs.firmware-build.result }}"
          test "${{ needs.firmware-build.result }}" = success

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h y species.h llevan "GENERADO - no editar" en su cabecera; esto pilla
      # a quien edite la salida en vez del generador, o se olvide de regenerar
      # tras tocar los datos de origen.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ and sim/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/ sim/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compilan y corren en el PC contra unos shims
      # de Arduino, con millis() y random() falsos y una NVS en memoria. Aqui es
      # donde se han roto las cosas: los tres bugs de la v1.3, v1.4 y v1.8 eran
      # logica pura y estos tests los pillan sin tocar la placa.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
